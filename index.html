<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="BenTar — Ben's saved guitar tabs, powered by Freetar data.">
  <title>BenTar</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./static/pages.css">
</head>
<body>
  <header class="topbar">
    <button id="homeButton" class="brand button-reset" type="button" aria-label="Back to My Tabs">BenTar</button>
    <input id="libraryFilter" type="search" placeholder="Search my tabs…" autocomplete="off" aria-label="Search saved tabs">
  </header>

  <main id="app">
    <section id="libraryView">
      <div class="section-head">
        <div>
          <h1>My Tabs</h1>
          <p id="libraryStatus">Loading GitHub library…</p>
        </div>
        <span class="pill">GitHub library</span>
      </div>

      <div id="libraryList" class="song-list" aria-live="polite"></div>
      <div id="emptyState" class="empty" hidden>No matching saved tabs.</div>
    </section>

    <section id="readerView" hidden>
      <div id="readerLoading" class="empty">Loading tab…</div>

      <div id="readerContent" hidden>
        <div class="reader-head">
          <button id="backButton" class="secondary" type="button">← My Tabs</button>
          <div class="reader-title-wrap">
            <h1 id="songTitle"></h1>
            <p id="songArtist"></p>
          </div>
        </div>

        <div id="songMeta" class="meta"></div>

        <div class="reader-toolbar">
          <button id="autoScroll" type="button">▶ Auto</button>
          <button id="speedDown" type="button">− Speed</button>
          <span id="speedLabel">2</span>
          <button id="speedUp" type="button">+ Speed</button>
          <button id="transposeDown" type="button">− Key</button>
          <span id="transposeLabel">0</span>
          <button id="transposeUp" type="button">+ Key</button>
          <button id="fontDown" type="button">A−</button>
          <button id="fontUp" type="button">A+</button>
        </div>

        <article id="tabReader" class="tab-reader"></article>
      </div>

      <div id="readerError" class="empty" hidden>
        <h2>BenTar couldn't load this saved chord sheet.</h2>
        <p>This tab may not have made it into the GitHub chord cache yet.</p>
        <a id="openFreetar" class="primary-link" href="#">Open this tab on Freetar</a>
        <button id="errorBackButton" class="secondary" type="button">← My Tabs</button>
      </div>
    </section>
  </main>

  <script src="./static/cache-interceptor.js"></script>
  <script src="./static/site.js" defer></script>
</body>
</html>
