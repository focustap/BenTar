<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="BenTar - a lightweight guitar tab reader with Freetar favorites import.">
  <title>{{ title or "BenTar" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand bg-body-tertiary sticky-top border-bottom border-secondary-subtle">
    <div class="container-fluid container-lg gap-2">
      <a class="navbar-brand fw-semibold" href="/">BenTar</a>
      <form class="d-flex flex-grow-1" method="get" action="/search">
        <input class="form-control" name="search_term" type="search" value="{{ search_term or '' }}" placeholder="Search songs or artists" aria-label="Search songs">
      </form>
      <button id="themeToggle" class="btn btn-outline-secondary" type="button" title="Toggle theme">◐</button>
    </div>
  </nav>

  <main class="container-lg py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
